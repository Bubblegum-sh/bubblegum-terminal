# XcodeGen spec: `xcodegen generate` creates Bubblegum.xcodeproj.
# SwiftPM (Package.swift + scripts/build-app.sh) builds the same sources without Xcode projects.
name: Bubblegum
options:
  bundleIdPrefix: dev.bubblegum
  deploymentTarget:
    macOS: "14.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  BubblegumCore:
    type: framework
    platform: macOS
    sources: [Sources/BubblegumCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bubblegum.core
        GENERATE_INFOPLIST_FILE: YES
  Bubblegum:
    type: application
    platform: macOS
    sources:
      - Sources/Bubblegum
      - Resources/Assets.xcassets
    dependencies:
      - target: BubblegumCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: Bubblegum
        PRODUCT_BUNDLE_IDENTIFIER: dev.bubblegum.app
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
  BubblegumCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BubblegumCoreTests]
    dependencies:
      - target: BubblegumCore
