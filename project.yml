# XcodeGen spec: `xcodegen generate` creates Flamingo.xcodeproj.
# SwiftPM (Package.swift + scripts/build-app.sh) builds the same sources without Xcode projects.
name: Flamingo
options:
  bundleIdPrefix: dev.flamingo
  deploymentTarget:
    macOS: "14.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  FlamingoCore:
    type: framework
    platform: macOS
    sources: [Sources/FlamingoCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flamingo.core
        GENERATE_INFOPLIST_FILE: YES
  Flamingo:
    type: application
    platform: macOS
    sources:
      - Sources/Flamingo
      - Resources/Assets.xcassets
    dependencies:
      - target: FlamingoCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: Flamingo
        PRODUCT_BUNDLE_IDENTIFIER: dev.flamingo.app
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
  FlamingoCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/FlamingoCoreTests]
    dependencies:
      - target: FlamingoCore
