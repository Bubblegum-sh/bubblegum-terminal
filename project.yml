# XcodeGen spec: `xcodegen generate` creates TerminalFlamingo.xcodeproj.
# SwiftPM (Package.swift + scripts/build-app.sh) builds the same sources without Xcode projects.
name: TerminalFlamingo
options:
  bundleIdPrefix: dev.terminalflamingo
  deploymentTarget:
    macOS: "14.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  TerminalFlamingoCore:
    type: framework
    platform: macOS
    sources: [Sources/TerminalFlamingoCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.terminalflamingo.core
        GENERATE_INFOPLIST_FILE: YES
  TerminalFlamingo:
    type: application
    platform: macOS
    sources:
      - Sources/TerminalFlamingo
      - Resources/Assets.xcassets
    dependencies:
      - target: TerminalFlamingoCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: Terminal Flamingo
        PRODUCT_BUNDLE_IDENTIFIER: dev.terminalflamingo.app
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
  TerminalFlamingoCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TerminalFlamingoCoreTests]
    dependencies:
      - target: TerminalFlamingoCore
